<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DnD VTT — Masuk Sesi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="landing">
  <div class="card sheet">
    <h1 class="display" style="text-align:center; color:var(--navy); font-size:26px; margin-bottom:4px;">⚔ DnD VTT ⚔</h1>
    <p class="hint serif" style="text-align:center; font-size:14px; margin-bottom:18px;">Character sheet &amp; virtual tabletop lokal</p>

    <div id="roleChoice">
      <div class="choice">
        <button id="btnBeDM">Aku Dungeon Master</button>
        <button id="btnBePlayer" class="secondary">Aku Player</button>
      </div>
    </div>

    <!-- ==== DM FLOW ==== -->
    <div id="dmFlow" style="display:none; margin-top:16px;">
      <div class="field">
        <label for="dmName">Nama DM</label>
        <input type="text" id="dmName" placeholder="cth. Kak Rio">
      </div>
      <button id="btnCreateSession" style="width:100%;">Buat Sesi Baru</button>

      <p class="hint" style="text-align:center; margin: 10px 0;">— atau lanjutkan sesi yang sudah ada —</p>
      <div class="field">
        <label for="dmRejoinCode">Kode Sesi</label>
        <input type="text" id="dmRejoinCode" maxlength="5" placeholder="cth. K7X2P" style="text-transform:uppercase;">
      </div>
      <button id="btnRejoinSession" class="secondary" style="width:100%;">Lanjutkan Sesi</button>
      <p class="error-msg" id="dmError"></p>
      <button id="btnBackFromDM" class="secondary small" style="margin-top:12px;">&larr; kembali</button>
    </div>

    <!-- ==== PLAYER FLOW ==== -->
    <div id="playerFlow" style="display:none; margin-top:16px;">
      <div class="field">
        <label for="pName">Nama Kamu</label>
        <input type="text" id="pName" placeholder="cth. Arwen">
      </div>
      <div class="field">
        <label for="pCode">Kode Sesi dari DM</label>
        <input type="text" id="pCode" maxlength="5" placeholder="cth. K7X2P" style="text-transform:uppercase;">
      </div>
      <button id="btnJoinSession" style="width:100%;">Gabung Sesi</button>
      <p class="error-msg" id="pError"></p>
      <button id="btnBackFromPlayer" class="secondary small" style="margin-top:12px;">&larr; kembali</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const roleChoice = document.getElementById('roleChoice');
const dmFlow = document.getElementById('dmFlow');
const playerFlow = document.getElementById('playerFlow');

document.getElementById('btnBeDM').onclick = () => { roleChoice.style.display='none'; dmFlow.style.display='block'; };
document.getElementById('btnBePlayer').onclick = () => { roleChoice.style.display='none'; playerFlow.style.display='block'; };
document.getElementById('btnBackFromDM').onclick = () => { dmFlow.style.display='none'; roleChoice.style.display='block'; };
document.getElementById('btnBackFromPlayer').onclick = () => { playerFlow.style.display='none'; roleChoice.style.display='block'; };

document.getElementById('btnCreateSession').onclick = () => {
  const dmName = document.getElementById('dmName').value.trim() || 'Dungeon Master';
  socket.emit('dm:create-session', { dmName }, (res) => {
    if (!res.ok) { document.getElementById('dmError').textContent = res.error || 'Gagal membuat sesi.'; return; }
    localStorage.setItem('dnd_dm_code', res.code);
    localStorage.setItem('dnd_dm_name', dmName);
    location.href = '/dm.html';
  });
};

document.getElementById('btnRejoinSession').onclick = () => {
  const code = document.getElementById('dmRejoinCode').value.trim().toUpperCase();
  if (!code) return;
  socket.emit('dm:rejoin-session', { code }, (res) => {
    if (!res.ok) { document.getElementById('dmError').textContent = res.error; return; }
    localStorage.setItem('dnd_dm_code', code);
    location.href = '/dm.html';
  });
};

document.getElementById('btnJoinSession').onclick = () => {
  const name = document.getElementById('pName').value.trim();
  const code = document.getElementById('pCode').value.trim().toUpperCase();
  if (!name || !code) { document.getElementById('pError').textContent = 'Isi nama dan kode sesi dulu ya.'; return; }
  const savedId = localStorage.getItem('dnd_player_id_' + code) || null;
  socket.emit('player:join-session', { code, name, playerId: savedId }, (res) => {
    if (!res.ok) { document.getElementById('pError').textContent = res.error; return; }
    localStorage.setItem('dnd_player_code', code);
    localStorage.setItem('dnd_player_name', name);
    localStorage.setItem('dnd_player_id_' + code, res.playerId);
    location.href = '/character.html';
  });
};

// enter-to-submit
document.getElementById('pCode').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnJoinSession').click(); });
document.getElementById('dmRejoinCode').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnRejoinSession').click(); });
</script>
</body>
</html>
